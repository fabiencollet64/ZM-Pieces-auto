# Déploiement automatique sur GitHub Pages à chaque modification des branches listées.
# Réglage obligatoire dans le dépôt : Settings > Pages > Build and deployment > Source : "GitHub Actions".
# (Avec "Deploy from a branch", GitHub publie le README au lieu du site.)
name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - main
      - claude/stoic-cerf-ep2ly3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
